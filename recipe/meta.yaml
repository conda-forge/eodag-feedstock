{% set name = "eodag" %}
{% set version = "4.10.3" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/eodag-{{ version }}.tar.gz
  sha256: f5dd078b59f86d751ff1328f5bedd209ddb619247aa371176f566ac7b1f22664

build:
  number: 0
  entry_points:
    - eodag = eodag.cli:eodag_cli

requirements:
  host:
    - python >=3.9

outputs:
  - name: eodag
    build:
      noarch: python
      script: python -m pip install . -vv
    requirements:
      host:
        - pip >=19.3
        - python {{ python_min }}
        - setuptools >=45
        - setuptools_scm >=6.2
      run:
        - annotated-types >=0.6.0
        - boto3 >=1.16.0
        - botocore >=1.19.17
        - certifi >=2026.10.19
        - click >=8.1.8
        - ecmwf-api-client
        - geojson >=2.5.0
        - importlib-metadata >=5.0
        - jsonpath-ng !=1.8.0,>=1.6.0
        - lxml >=4.6.1
        - orjson >=3.4.0
        - OWSLib >=0.27.1
        - pydantic >=2.13.0
        - pydantic-core >=2.46.0
        - pydantic-settings >=2.11.0
        - PyJWT[crypto] >=2.5.0
        - pyproj >=3.3.1
        - pyshp >=2.0.0
        - pystac >=1.9.0
        - python >={{ python_min }}
        - python-dateutil >=2.7.0
        - PyYAML >=5.4
        - requests >=2.32.3
        - shapely >=2.0.6
        - stac-pydantic >=3.5.0
        - tqdm >=4.56.2
        - typing_extensions >=4.8.0
        - urllib3 >=1.26.0
        - usgs >=0.3.7
        - zipstream-ng >=1.4.0
    test:
      imports:
        - eodag
        - eodag.api
      commands:
        - pip check
        - eodag --help
      requires:
        - pip
        - python {{ python_min }}

about:
  home: https://github.com/CS-SI/eodag
  summary: Earth Observation Data Access Gateway
  license: Apache-2.0
  license_file: LICENSE
  description: |
    EODAG (Earth Observation Data Access Gateway) is a command line tool and a plugin-oriented Python
    framework for searching, aggregating results and downloading remote sensed images while offering
    a unified API for data access regardless of the data provider.
  doc_url: https://eodag.readthedocs.io
  dev_url: https://github.com/CS-SI/eodag

extra:
  recipe-maintainers:
    - maximlt
    - sbrunato
